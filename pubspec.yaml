name: civicvoice
description: "A citizen-first platform for reporting and tracking community issues."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0

  # State Management
  provider: ^6.1.1

  # Image Handling
  image_picker: ^1.1.1
  image_cropper: ^8.0.0
  flutter_image_compress: ^2.2.0
  cached_network_image: ^3.3.1

  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  intl: ^0.19.0
  intl_phone_field: ^3.2.0
  flutter_staggered_grid_view: ^0.7.0

  # Utilities
  shared_preferences: ^2.2.3
  
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  uuid: ^4.4.0

  # Notifications
  flutter_local_notifications: ^17.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
